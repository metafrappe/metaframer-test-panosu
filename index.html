main{min-width:0}

.wrap{padding:36px 40px 60px;max-width:1240px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
h1{margin:0 0 6px;font-size:34px;letter-spacing:-.02em;line-height:1.1}

  .wrap{padding:22px 16px 48px}
  h1{font-size:26px}
  .lead{margin-bottom:18px}

  .copy{min-height:32px;padding:0 8px}

  .tools{margin-bottom:18px}
  .search{width:100%;min-height:46px}

  .legend{font-size:12px;gap:10px}
  .group{margin-bottom:26px}
  .ghead{align-items:center}.ghead h3{font-size:17px}.ghead p{font-size:12.5px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:14px 14px 48px;border-radius:12px}
  .card .nm{font-size:15px}
  .card .go{width:40px;height:40px;display:grid;place-items:center;margin-top:-6px;margin-right:-8px}
  .links a{font-size:12px;padding:6px 10px;min-height:32px;display:inline-flex;align-items:center}
  .chk{right:12px;bottom:10px;min-height:36px;padding:6px 4px;font-size:12.5px}
  .chk input{width:18px;height:18px}

</head>

const GROUPS=[
 ["sektor","Sektör uygulamaları","Bu siteyi diğerlerinden ayıran dikey çözümler"],
 ["iletisim","İletişim ve iş birliği","CRM, destek, mesajlaşma, dosya ve toplantı"],
 ["entegrasyon","Entegrasyonlar","Kargo, muhasebe, depolama ve kimlik; dış hesap ister"],
 ["ai","Yapay zekâ","LLM anahtarı girilince çalışır"],
 ["yetki","Yetki ve geliştirici araçları","Yetki katmanları, düşük kod ve API araçları"],
 ["rapor","Raporlama","İş zekası"],
 ["taban","Ortak taban","Her sitede aynı 8 uygulama"],
];
const GROUP_OF={
 "crm":"iletisim","helpdesk":"iletisim","raven":"iletisim","gameplan":"iletisim","Wiki":"iletisim","Frappe Drive":"iletisim","WhatsApp Integration":"iletisim","Telephony":"iletisim","Meet":"iletisim","Mail":"iletisim","Frappe Suite":"iletisim","MINutes Of Meeting":"iletisim","WorkBoard":"iletisim",
 "ERPNext Shipping":"entegrasyon","LOGO Tiger Integration":"entegrasyon","Yurtiçi Kargo ERPNext":"entegrasyon","DHL eCommerce Cargo":"entegrasyon","Metabase Integration":"entegrasyon","Ecommerce Integrations":"entegrasyon","Frappe S3 Attachment":"entegrasyon","Frappe S3 Improwised":"entegrasyon","OIDC Extended":"entegrasyon","Ghost":"entegrasyon","Frappe Appointment":"entegrasyon",
 "Ask ALYF":"ai","NextAssist":"ai","Flow":"ai","Frappe Assistant Core":"ai",
 "Studio":"yetki","builder":"yetki","Doppio":"yetki","Frappe Types":"yetki","Swagger UI":"yetki","DocType Permission":"yetki","Frappe Permission Manager":"yetki",
 "insights":"rapor",
};
const TABAN=new Set(BASE.map(b=>b.app));
const LBL={ok:"hazır",warn:"ön koşul",ext:"dış servis"};
const ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>';
const ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg>';
let store={};try{store=JSON.parse(localStorage.getItem("mf-checked")||"{}")}catch(e){}
function save(){try{localStorage.setItem("mf-checked",JSON.stringify(store))}catch(e){}}
let active=(location.hash||"").slice(1);if(!SITES.some(s=>s.id===active))active=SITES[0].id;
let q="";
const nav=document.getElementById("sites");
SITES.forEach(s=>{const b=document.createElement("button");b.className="site-btn";b.innerHTML=`<span class="ini">${s.title[0].toUpperCase()}</span><span><span class="nm">${s.title}</span><br><span class="sc">${s.sector}</span></span>`;b.onclick=()=>{active=s.id;location.hash=s.id;render()};nav.appendChild(b)});
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  const s=SITES.find(x=>x.id===active);const host="https://"+s.id+".metaframer.net";
  [...nav.children].forEach((b,i)=>{const on=SITES[i].id===active;b.setAttribute("aria-pressed",on);if(on&&matchMedia("(max-width:900px)").matches)b.scrollIntoView({block:"nearest",inline:"center"})});
  document.getElementById("crumb").textContent=s.title;
  document.getElementById("tl-login").href=host+"/login";document.getElementById("tl-desk").href=host+"/desk";document.getElementById("tl-apps").href=host+"/app/installed-applications";
  const done=s.apps.filter(a=>store[s.id+"|"+a.app]).length;
  const groups=GROUPS.map(([id,title,desc])=>({id,title,desc,apps:s.apps.filter(a=>(TABAN.has(a.app)?"taban":(GROUP_OF[a.app]||"sektor"))===id).filter(a=>!q||a.app.toLowerCase().includes(q)||a.note.toLowerCase().includes(q)||a.links.some(l=>l.includes(q)))})).filter(g=>g.apps.length);
  let tint=0;
  const html=`
  <p class="eyebrow">Test sitesi</p>
  <h1>${s.title}</h1>
  <p class="lead">${s.sector} · ${s.apps.length} uygulama · ${done} kontrol edildi</p>
  <div class="hero">
    <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></div>
    <div class="tx"><p class="eyebrow" style="margin:0 0 2px">Önce giriş yap</p><h2>${s.id}.metaframer.net</h2><p>Bağlantılar bu sitede açılır; oturum yoksa giriş sayfasına düşer. Chrome ilk girişte parolayı kaydetmeyi teklif eder, kabul edersen sonrakiler tek tık.</p>
    <div class="user">kullanıcı <code id="u">${s.user}</code><button class="copy" onclick="navigator.clipboard&&navigator.clipboard.writeText('${s.user}');this.textContent='kopyalandı';setTimeout(()=>this.textContent='kopyala',1200)">kopyala</button></div></div>
    <a class="btn" href="${host}/login" target="_blank" rel="noopener">Giriş yap <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <div class="tools">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" value="${esc(q)}" placeholder="Bu sitede uygulama ara… (ör. whatsapp, pos, kargo)"></label>
    <div class="legend"><span><span class="pill ok">hazır</span> kurulumla açılır</span><span><span class="pill warn">ön koşul</span> sitede kayıt gerekir</span><span><span class="pill ext">dış servis</span> API veya sunucu ister</span></div>
  </div>
  ${groups.length?groups.map(g=>`<section class="group"><div class="ghead"><div><h3>${g.title}</h3><p>${g.desc}</p></div><span class="cnt">${g.apps.length} uygulama</span></div><div class="grid">${g.apps.map(a=>{const key=s.id+"|"+a.app;const t="t"+((tint++%4)+1);const main=host+a.links[0];return`
    <article class="card${store[key]?" done":""}" data-key="${esc(key)}">
      <div class="row"><a class="tile ${t}" href="${main}" target="_blank" rel="noopener" title="${esc(a.links[0])}">${ICON}</a>
        <div style="min-width:0;flex:1"><div class="nm"><a href="${main}" target="_blank" rel="noopener">${esc(a.app)}</a><span class="pill ${a.tag}">${LBL[a.tag]}</span></div><div class="desc">${esc(a.note)}</div></div>
        <a class="go" href="${main}" target="_blank" rel="noopener" title="Aç">${ARROW}</a></div>
      <div class="links">${a.links.map(l=>`<a href="${host}${l}" target="_blank" rel="noopener">${l}</a>`).join("")}</div>
      <label class="chk"><input type="checkbox" ${store[key]?"checked":""}> kontrol edildi</label>
    </article>`}).join("")}</div></section>`).join(""):`<div class="empty">Bu sitede "${esc(q)}" ile eşleşen uygulama yok.</div>`}`;
  const wrap=document.getElementById("wrap");wrap.innerHTML=html;
  const qi=document.getElementById("q");qi.addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();const pos=e.target.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)});
  wrap.querySelectorAll(".chk input").forEach(inp=>inp.onchange=e=>{const card=e.target.closest(".card");store[card.dataset.key]=e.target.checked;save();card.classList.toggle("done",e.target.checked);document.querySelector(".lead").textContent=`${s.sector} · ${s.apps.length} uygulama · ${s.apps.filter(a=>store[s.id+"|"+a.app]).length} kontrol edildi`});
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SITES.some(s=>s.id===h)&&h!==active){active=h;render()}});
render();
</script>
</body>
</html>
